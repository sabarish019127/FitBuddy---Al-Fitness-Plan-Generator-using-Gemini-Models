<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FitBuddy - AI Fitness Plan Generator</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

<div class="page">

    <header class="hero">

        <div class="hero-content">

            <h1>💪 FitBuddy</h1>

            <h2>AI Fitness Plan Generator</h2>

            <p>
                Create a personalized workout and nutrition plan
                based on your fitness goals.
            </p>

        </div>

    </header>


    <main class="container">

        <div class="card">

            <h2>✨ Create Your Fitness Plan</h2>

            <p class="subtitle">
                Enter your details and FitBuddy will generate
                your personalized 7-day plan.
            </p>


            <form action="{{ url_for('main.generate') }}" method="POST">

                <!-- Name -->

                <div class="form-group">

                    <label for="name">
                        Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                        required
                    >

                </div>


                <!-- Age -->

                <div class="form-group">

                    <label for="age">
                        Age
                    </label>

                    <input
                        type="number"
                        id="age"
                        name="age"
                        min="13"
                        max="100"
                        placeholder="Enter your age"
                        required
                    >

                </div>


                <!-- Gender -->

                <div class="form-group">

                    <label for="gender">
                        Gender
                    </label>

                    <select
                        id="gender"
                        name="gender"
                        required
                    >

                        <option value="">
                            Select gender
                        </option>

                        <option value="male">
                            Male
                        </option>

                        <option value="female">
                            Female
                        </option>

                        <option value="other">
                            Other
                        </option>

                    </select>

                </div>


                <!-- Height -->

                <div class="form-group">

                    <label for="height_cm">
                        Height (cm)
                    </label>

                    <input
                        type="number"
                        id="height_cm"
                        name="height_cm"
                        step="0.1"
                        min="50"
                        placeholder="Example: 165"
                        required
                    >

                </div>


                <!-- Weight -->

                <div class="form-group">

                    <label for="weight_kg">
                        Weight (kg)
                    </label>

                    <input
                        type="number"
                        id="weight_kg"
                        name="weight_kg"
                        step="0.1"
                        min="20"
                        placeholder="Example: 70"
                        required
                    >

                </div>


                <!-- Goal -->

                <div class="form-group">

                    <label for="goal">
                        Fitness Goal
                    </label>

                    <select
                        id="goal"
                        name="goal"
                        required
                    >

                        <option value="">
                            Select your goal
                        </option>

                        <option value="fat_loss">
                            Fat Loss
                        </option>

                        <option value="muscle_gain">
                            Muscle Gain
                        </option>

                        <option value="maintenance">
                            Maintain Weight
                        </option>

                    </select>

                </div>


                <!-- Activity -->

                <div class="form-group">

                    <label for="activity_level">
                        Activity Level
                    </label>

                    <select
                        id="activity_level"
                        name="activity_level"
                        required
                    >

                        <option value="">
                            Select activity level
                        </option>

                        <option value="sedentary">
                            Sedentary
                        </option>

                        <option value="light">
                            Lightly Active
                        </option>

                        <option value="moderate">
                            Moderately Active
                        </option>

                        <option value="very_active">
                            Very Active
                        </option>

                    </select>

                </div>


                <!-- Workout Days -->

                <div class="form-group">

                    <label for="workout_days">
                        Workout Days Per Week
                    </label>

                    <select
                        id="workout_days"
                        name="workout_days"
                        required
                    >

                        <option value="">
                            Select days
                        </option>

                        <option value="1">1 Day</option>
                        <option value="2">2 Days</option>
                        <option value="3">3 Days</option>
                        <option value="4">4 Days</option>
                        <option value="5">5 Days</option>
                        <option value="6">6 Days</option>
                        <option value="7">7 Days</option>

                    </select>

                </div>


                <!-- Equipment -->

                <div class="form-group">

                    <label for="equipment">
                        Available Equipment
                    </label>

                    <select
                        id="equipment"
                        name="equipment"
                        required
                    >

                        <option value="">
                            Select equipment
                        </option>

                        <option value="no_equipment">
                            No Equipment
                        </option>

                        <option value="home">
                            Home Equipment
                        </option>

                        <option value="dumbbells">
                            Dumbbells
                        </option>

                        <option value="gym">
                            Full Gym
                        </option>

                    </select>

                </div>


                <!-- Diet -->

                <div class="form-group">

                    <label for="diet">
                        Diet Preference
                    </label>

                    <select
                        id="diet"
                        name="diet"
                        required
                    >

                        <option value="">
                            Select diet
                        </option>

                        <option value="vegetarian">
                            Vegetarian
                        </option>

                        <option value="non_vegetarian">
                            Non-Vegetarian
                        </option>

                        <option value="vegan">
                            Vegan
                        </option>

                        <option value="eggetarian">
                            Eggetarian
                        </option>

                    </select>

                </div>


                <!-- Allergies -->

                <div class="form-group">

                    <label for="allergies">
                        Allergies / Food Intolerances
                    </label>

                    <input
                        type="text"
                        id="allergies"
                        name="allergies"
                        placeholder="Example: peanuts, milk (optional)"
                    >

                </div>


                <!-- Submit -->

                <button
                    type="submit"
                    class="btn"
                >
                    🚀 Generate My Fitness Plan
                </button>

            </form>

        </div>


        <div class="links">

            <a href="{{ url_for('main.all_users') }}">
                👥 View All Users
            </a>

            <a href="{{ url_for('main.health') }}">
                ❤️ API Health
            </a>

        </div>

    </main>


    <footer>

        <p>
            FitBuddy © 2026 | AI Fitness Plan Generator
        </p>

    </footer>

</div>

</body>
</html>
